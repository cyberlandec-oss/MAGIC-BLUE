name: refresh composer security lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor == 'cyberlandec-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Update security-patched packages
        run: composer update phpunit/phpunit symfony/mime --with-all-dependencies --no-scripts --no-interaction

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- composer.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore: update security-patched composer dependencies'
          git push
